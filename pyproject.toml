[project]
name = "techdoc-rag"
version = "0.1.0"
description = "산업 기술문서 기반 근거 추적형 QA와 설계변수 구조화 추출을 제공하는 Local AI 시스템"
requires-python = ">=3.12"

# 실제로 사용하는 것만 등록한다. 파이프라인을 구현하면서
# pymupdf, qdrant-client, llama-index, fastapi, streamlit을 순차적으로 추가한다.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # PDF 파서. PyMuPDF는 AGPL-3.0이라 이 코드를 재사용하려는 쪽에 라이선스 부담을 넘긴다.
    # pypdfium2는 BSD-3-Clause / Apache-2.0 택일이고 현재 요구(페이지 단위 텍스트 추출,
    # 텍스트 없는 페이지 식별)에 충분하다. 표 추출이 병목이 되면 그때 재검토한다.
    "pypdfium2>=5.13",
]

[project.optional-dependencies]
dev = [
    "psutil>=7.0",   # scripts/benchmark_llm.py의 RAM peak 측정
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
