[project]
name = "techdoc-rag"
version = "0.1.0"
description = "산업 기술문서 기반 근거 추적형 QA와 설계변수 구조화 추출을 제공하는 Local AI 시스템"
requires-python = ">=3.12"

# 실제로 사용하는 것만 등록한다. 파이프라인을 구현하면서
# pymupdf, qdrant-client, llama-index, fastapi, streamlit을 순차적으로 추가한다.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "psutil>=7.0",   # scripts/benchmark_llm.py의 RAM peak 측정
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
