[project]
name = "techdoc-rag"
version = "0.1.0"
description = "산업 기술문서 기반 근거 추적형 QA와 설계변수 구조화 추출을 제공하는 Local AI 시스템"
requires-python = ">=3.12"

# 실제로 사용하는 것만 등록한다. 파이프라인을 구현하면서
# qdrant-client, llama-index, fastapi, streamlit을 순차적으로 추가한다.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # PDF 파서. PyMuPDF는 AGPL-3.0이라 이 코드를 재사용하려는 쪽에 라이선스 부담을 넘긴다.
    # pypdfium2는 BSD-3-Clause / Apache-2.0 택일이고 현재 요구(페이지 단위 텍스트 추출,
    # 텍스트 없는 페이지 식별)에 충분하다. 표 추출이 병목이 되면 그때 재검토한다.
    "pypdfium2>=5.13",
    # 벡터 저장소. 로컬 모드(:memory:)를 지원해 테스트에 서버가 필요 없다.
    "qdrant-client>=1.12",
    # HTTP 경계(#27). pydantic 검증은 fastapi가 끌고 온다.
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # 질의 화면(#29). API 호출은 표준 라이브러리로 해서 추가 의존성 없음.
    "streamlit>=1.38",
]

[project.optional-dependencies]
dev = [
    "httpx2>=0.1",   # fastapi TestClient가 요구 (구 httpx는 starlette에서 deprecated)
    "psutil>=7.0",   # scripts/benchmark_llm.py의 RAM peak 측정
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # 로컬 모드에는 payload 인덱스가 없다는 경고. 운영 서버에서는 필요한 호출이라
    # 코드를 빼지 않고 테스트 출력에서만 가린다.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
