# 설정값은 코드에 하드코딩하지 않는다.
#
# [미확정, 시작점] 표시가 붙은 값은 실측이나 실험으로 정해지지 않은 임시값이다.
# 성과 판정에 쓰지 않으며, Step 8 파라미터 실험 후 교체한다.
#
# 엔드포인트와 API 키는 이 파일이 아니라 .env에서 읽는다. 이 파일은 커밋되고 .env는 안 된다.

llm:
  # 2026-08-22 실측: 이 장비에서 100% CPU로 동작하며 iGPU 가속은 붙지 않는다.
  model_name: "qwen3.5:4b-q4_K_M"
  temperature: 0.0
  # Qwen3.5는 thinking이 기본 ON이고 지연을 배 단위로 바꾼다.
  thinking_enabled: false
  runtime_context_tokens: 8192      # [미확정, 시작점]
  generation_max_tokens: 512        # [미확정, 시작점] 허용 응답시간이 정해지면 역산한다
  # 동시 생성 수(DP-51). 1은 CPU 환경을 전제한 값이고 측정으로 확인하지 않았다.
  # GPU를 확보하거나 추론 서버를 분리하면 올린다.
  max_concurrent_generations: 1
  # 앞의 것은 순서를 기다리는 상한, 뒤의 것은 생성 자체의 상한이다.
  # [미확정, 시작점] 4B가 8 tok/s라 512토큰이면 64초쯤 걸린다.
  queue_timeout_seconds: 120
  generation_timeout_seconds: 300

embedding:
  # 2026-08-30 실측으로 정한 baseline (DP-49). 이 장비에서 0.64 chunk/s, 질의 87ms.
  # 최종 확정이 아니라 색인을 시작하기 위한 값이며 평가셋 확보 후 재검토한다.
  model_name: "bge-m3"
  # 실효 상한은 컨텍스트 길이가 아니라 배치 크기다. Ollama는 num_ctx가 8192여도
  # num_batch(기본 2048)에서 자른다. 이 값을 num_batch로 넘기고 max_input_tokens로 쓴다.
  # 현재 청크 최대가 782토큰이라 2048에 여유가 있다.
  max_input_tokens: 2048
  # 한 번의 embed_documents 호출에 넘길 청크 수. 호출자가 이 크기로 나눠 부른다.
  # 0.64 chunk/s이므로 128개면 약 200초다. 리스 300초 안에 들어온다.
  batch_size: 128

chunking:
  # 크기 단위는 토큰이 아니라 문자 수다. 토큰을 세려면 토크나이저가 필요한데
  # 임베딩 모델이 미정(M9)이라 지금 "tokens"라는 키는 지키지 못하는 약속이다.
  # M9 확정 후 토큰 기준 전환을 재검토하며, 그때 config_version을 올린다.
  size_chars: 1200                  # [미확정, 시작점]
  overlap_chars: 150                # [미확정, 시작점]
  config_version: "v1"              # 설정이 바뀌면 올린다. 재색인 판단 근거가 된다

retrieval:
  # 5에서 8로 올림(#32). 사양표가 표 구조를 잃고 추출되어 항목과 값의 대응이
  # 끊겼고, 맞는 표가 상위 5건에 못 들어오는 경우가 관측됨. 근거가 늘면
  # 프롬프트 예산과 생성 시간도 늘어나므로 평가셋 확보 후 다시 정함.
  top_k: 8                          # [미확정, 시작점]
  similarity_threshold: 0.0         # [미확정, 시작점] 사실상 거르지 않음(코사인은 음수 가능)
  # 프롬프트에 넣는 근거의 문자 수 예산. 토큰이 아닌 이유는 chunking 주석과 같음.
  # 7200에서 11500으로 올림(#32). 7200은 블록 1,402자 기준 5개까지만 담겨서
  # top_k를 8로 올려도 프롬프트에는 5개만 들어갔음(실측).
  # [실측 2026-09-07 · DESKTOP-K3FF7JU] 이 매뉴얼 본문은 한글 1자당 0.52토큰.
  # 근거 10개 11,929자 = 6,235토큰으로, 쓸 수 있는 7,680토큰
  # (num_ctx 8,192 - 생성 512) 안에 들어감. 11,500자는 8개분에 여유를 둔 값.
  # 다른 문서군은 자당 토큰이 다를 수 있으므로 문서군이 바뀌면 다시 잼.
  context_budget_chars: 11500
  # 질의 재작성(#32, DP-17). 짧은 질문만 검색용 표현 여러 개로 넓힌 뒤 결과를 합침.
  #
  # **기본값을 false로 둠.** 구현은 끝났고 테스트도 있으나, 프로브에서 이득이
  # 관측되지 않았음(2026-09-07, DESKTOP-K3FF7JU).
  #   - 응답 시간: 짧은 질문 평균 +3.6초(3.1초 -> 11.8초인 질문도 있음)
  #   - 근거 일치: '정격출력' 묶음 3건의 공통 근거는 여전히 없음
  #   - 회귀 1건: '설치할 때 온도 몇 도까지' 답이 메타 발언으로 바뀜
  # 정답 라벨이 없어 품질 개선을 판정할 수 없으므로, 켜는 판단은 평가셋 확보
  # 후로 미룸. 켜려면 true로 바꾸면 됨.
  expand_short_queries: false
  # [미확정, 시작점] 이 길이 이하인 질문만 확장 대상으로 봄. 재서 정한 값이
  # 아니라 임의로 잡은 시작점임. 질의 확장이 꺼져 있어 지금은 동작에 영향이
  # 없음. 켜기 전에 평가셋의 질문 길이 분포를 보고 다시 정함.
  short_query_chars: 20
  # [미확정, 시작점] 원문을 포함한 검색 표현 최대 개수. 이 값도 재서 정하지
  # 않았음. 위에 적은 응답 시간 +3.6초는 이 값이 3일 때 나온 수치임.
  max_query_variants: 3

api:
  # [미확정, 시작점] 질문 길이 상한. 프롬프트 예산 보호용이며 평가셋의 실제
  # 질문 길이 분포를 보고 조정한다.
  max_question_chars: 1000

prompt:
  version: "v1"                     # 답변 재현성 추적용

indexing:
  # heartbeat으로 리스를 연장한다. 리스가 만료되면 죽은 프로세스로 보고 강등한다.
  # [미확정, 시작점] bge-m3가 0.64 chunk/s라 128개 배치가 200초쯤 걸린다.
  # 실제로 색인을 돌려본 뒤 조정한다.
  heartbeat_interval_seconds: 30
  lease_seconds: 300

storage:
  document_root: "data/documents"
  metadata_database_path: "data/metadata.db"
  # 쓰기는 실제 컬렉션 이름으로, 읽기는 alias로 한다 (05 §1.7).
  # 이름에 임베딩 모델을 넣어 모델을 바꾸면 새 컬렉션을 만들고 alias만 전환한다.
  qdrant_collection_name: "techdoc-bge-m3-v1"
  qdrant_read_alias: "techdoc"
